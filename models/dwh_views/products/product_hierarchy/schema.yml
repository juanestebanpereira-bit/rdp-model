# =============================================================================
# schema.yml — dwh_views/products/product_hierarchy
# =============================================================================
# Defines PK/FK constraints for the stable public-facing views over the
# Product Hierarchy physical dimension tables.
# Column descriptions reference doc() blocks defined in
# models/docs__product_hierarchy.md and models/docs__rdp_system_columns.md.
#
# Subject Area: Products
# Component:    Product Hierarchy
# Layer:        Data Warehouse Views (dwh_views)
# Owner:        RDP Product Team
# =============================================================================

version: 2

models:

  # ---------------------------------------------------------------------------
  # vw_dim_departments
  # ---------------------------------------------------------------------------
  - name: vw_dim_departments
    description: >
      Stable public-facing view over dim_departments. Provides a consistent
      interface to the physical dimension table, absorbing any breaking schema
      changes before they reach downstream consumers.
    constraints:
      - type: primary_key
        columns: [department_id]

    columns:
      - name: department_id
        description: "{{ doc('department_id') }}"

      - name: department_number
        description: "{{ doc('department_number') }}"

      - name: department_name
        description: "{{ doc('department_name') }}"

      - name: rdp_source_system
        description: "{{ doc('rdp_source_system') }}"

      - name: rdp_created_at
        description: "{{ doc('rdp_created_at') }}"

      - name: rdp_updated_at
        description: "{{ doc('rdp_updated_at') }}"

  # ---------------------------------------------------------------------------
  # vw_dim_classes
  # ---------------------------------------------------------------------------
  - name: vw_dim_classes
    description: >
      Stable public-facing view over dim_classes. Provides a consistent
      interface to the physical dimension table, absorbing any breaking schema
      changes before they reach downstream consumers.
    constraints:
      - type: primary_key
        columns: [class_id]

    columns:
      - name: class_id
        description: "{{ doc('class_id') }}"

      - name: department_id
        description: "{{ doc('department_id') }}"
        constraints:
          - type: foreign_key
            to: ref('vw_dim_departments')
            to_columns: [department_id]

      - name: class_number
        description: "{{ doc('class_number') }}"

      - name: class_name
        description: "{{ doc('class_name') }}"

      - name: department_number
        description: "{{ doc('department_number') }}"

      - name: department_name
        description: "{{ doc('department_name') }}"

      - name: rdp_source_system
        description: "{{ doc('rdp_source_system') }}"

      - name: rdp_created_at
        description: "{{ doc('rdp_created_at') }}"

      - name: rdp_updated_at
        description: "{{ doc('rdp_updated_at') }}"

  # ---------------------------------------------------------------------------
  # vw_dim_styles
  # ---------------------------------------------------------------------------
  - name: vw_dim_styles
    description: >
      Stable public-facing view over dim_styles. Provides a consistent
      interface to the physical dimension table, absorbing any breaking schema
      changes before they reach downstream consumers.
    constraints:
      - type: primary_key
        columns: [style_id]

    columns:
      - name: style_id
        description: "{{ doc('style_id') }}"

      - name: class_id
        description: "{{ doc('class_id') }}"
        constraints:
          - type: foreign_key
            to: ref('vw_dim_classes')
            to_columns: [class_id]

      - name: department_id
        description: "{{ doc('department_id') }}"

      - name: style_number
        description: "{{ doc('style_number') }}"

      - name: style_name
        description: "{{ doc('style_name') }}"

      - name: class_number
        description: "{{ doc('class_number') }}"

      - name: class_name
        description: "{{ doc('class_name') }}"

      - name: department_number
        description: "{{ doc('department_number') }}"

      - name: department_name
        description: "{{ doc('department_name') }}"

      - name: rdp_source_system
        description: "{{ doc('rdp_source_system') }}"

      - name: rdp_created_at
        description: "{{ doc('rdp_created_at') }}"

      - name: rdp_updated_at
        description: "{{ doc('rdp_updated_at') }}"

  # ---------------------------------------------------------------------------
  # vw_dim_items
  # ---------------------------------------------------------------------------
  - name: vw_dim_items
    description: >
      Stable public-facing view over dim_items. Provides a consistent
      interface to the physical dimension table, absorbing any breaking schema
      changes before they reach downstream consumers.
    constraints:
      - type: primary_key
        columns: [item_id]

    columns:
      - name: item_id
        description: "{{ doc('item_id') }}"

      - name: style_id
        description: "{{ doc('style_id') }}"
        constraints:
          - type: foreign_key
            to: ref('vw_dim_styles')
            to_columns: [style_id]

      - name: class_id
        description: "{{ doc('class_id') }}"

      - name: department_id
        description: "{{ doc('department_id') }}"

      - name: item_number
        description: "{{ doc('item_number') }}"

      - name: item_name
        description: "{{ doc('item_name') }}"

      - name: style_number
        description: "{{ doc('style_number') }}"

      - name: style_name
        description: "{{ doc('style_name') }}"

      - name: class_number
        description: "{{ doc('class_number') }}"

      - name: class_name
        description: "{{ doc('class_name') }}"

      - name: department_number
        description: "{{ doc('department_number') }}"

      - name: department_name
        description: "{{ doc('department_name') }}"

      - name: rdp_source_system
        description: "{{ doc('rdp_source_system') }}"

      - name: rdp_created_at
        description: "{{ doc('rdp_created_at') }}"

      - name: rdp_updated_at
        description: "{{ doc('rdp_updated_at') }}"
